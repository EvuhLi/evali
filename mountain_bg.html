<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ink Mountain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f0e8; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }
  #scroll-space { height: 300vh; }
  #info {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    color: #888; font-family: serif; font-size: 13px;
    letter-spacing: 0.12em; opacity: 0.7;
    pointer-events: none; text-align: center; white-space: nowrap;
  }
  #progress-bar {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 1px; background: rgba(0,0,0,0.15);
  }
  #progress-fill { height: 100%; background: #8b1a0e; width: 0%; }
</style>
</head>
<body>
<div id="scroll-space"></div>
<div id="info">↓ scroll to ascend</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f0e8);
scene.fog = new THREE.FogExp2(0xf5f0e8, 0.018);

const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
dirLight.position.set(5, 16, 6);
scene.add(dirLight);

const HM_B64 = "hm.png";

const surfaceVert = `
  uniform sampler2D heightMap;
  uniform float displacementScale;
  varying float vHeight;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying vec2 vUv;
  varying vec3 vWorldPos;
  void main() {
    vUv = uv;
    float eps = 1.0 / 512.0;
    float h  = texture2D(heightMap, uv).r;
    float hL = texture2D(heightMap, uv + vec2(-eps, 0.0)).r;
    float hR = texture2D(heightMap, uv + vec2( eps, 0.0)).r;
    float hD = texture2D(heightMap, uv + vec2(0.0, -eps)).r;
    float hU = texture2D(heightMap, uv + vec2(0.0,  eps)).r;
    vHeight = h;
    vec3 N = normalize(vec3(
      (hL - hR) * displacementScale * 3.5,
      2.0,
      (hD - hU) * displacementScale * 3.5
    ));
    vWorldNormal = normalize((modelMatrix * vec4(N, 0.0)).xyz);
    vec3 displaced = position + normal * h * displacementScale;
    vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
    vViewDir = normalize(cameraPosition - worldPos.xyz);
    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const surfaceFrag = `
  uniform float mistLevel;
  varying float vHeight;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying vec2 vUv;
  varying vec3 vWorldPos;

  void main() {
    vec3 n = normalize(vWorldNormal);
    vec3 keyDir = normalize(vec3(0.4, 1.0, 0.6));
    float key = max(dot(n, keyDir), 0.0);
    float fresnel = pow(1.0 - max(dot(n, normalize(vViewDir)), 0.0), 2.8);

    vec3 paper    = vec3(0.97, 0.95, 0.91);
    vec3 inkBlack = vec3(0.06, 0.05, 0.07);
    vec3 inkGray  = vec3(0.55, 0.52, 0.50);

    // Steeper ramp: lit faces hit paper white quickly, shadows stay deep
    vec3 color = mix(inkBlack, paper, smoothstep(0.2, 0.7, key));
    // Only apply gray wash in deep shadow (not mid-tones)
    color = mix(inkGray * 0.55, color, smoothstep(0.0, 0.28, key));
    color = mix(inkBlack, color, 1.0 - fresnel * 0.55);
    color = mix(color, inkBlack, vHeight * vHeight * 0.3);
    color = clamp(color, 0.0, 1.0);

    float faceAll = smoothstep(0.05, 1.0, vHeight);
    float litFace = smoothstep(0.35, 0.65, key);

    // Flow strokes radiate outward from peak center in world space
    vec2 slope2d = vec2(n.x, n.z);
    float slopeLen = length(slope2d);
    vec2 radial = length(vWorldPos.xz) > 0.01 ? normalize(vWorldPos.xz) : vec2(1.0, 0.0);
    float flowCoord2 = dot(vWorldPos.xz * 1.8, radial);
    float flow2 = mod(flowCoord2, 1.0);
    float flowLine2 = 1.0 - smoothstep(0.0, 0.07, flow2);
    flowLine2 = max(flowLine2, 1.0 - smoothstep(0.93, 1.0, flow2));
    float slopeFade2 = smoothstep(0.02, 0.15, slopeLen) * (1.0 - smoothstep(1.2, 2.0, slopeLen));
    color = mix(color, inkBlack * 0.76, flowLine2 * slopeFade2 * faceAll * litFace * 0.68);

    float alpha = smoothstep(mistLevel - 0.05, mistLevel + 0.10, vHeight);
    gl_FragColor = vec4(color, alpha);
  }
`;

const outlineVert = `
  uniform sampler2D heightMap;
  uniform float displacementScale;
  uniform float outlineThickness;
  varying float vHeight;
  void main() {
    float eps = 1.0 / 512.0;
    float h  = texture2D(heightMap, uv).r;
    float hL = texture2D(heightMap, uv + vec2(-eps, 0.0)).r;
    float hR = texture2D(heightMap, uv + vec2( eps, 0.0)).r;
    float hD = texture2D(heightMap, uv + vec2(0.0, -eps)).r;
    float hU = texture2D(heightMap, uv + vec2(0.0,  eps)).r;
    vHeight = h;
    vec3 N = normalize(vec3(
      (hL - hR) * displacementScale * 3.5,
      2.0,
      (hD - hU) * displacementScale * 3.5
    ));
    vec3 displaced = position + normal * h * displacementScale + N * outlineThickness;
    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(displaced, 1.0);
  }
`;
const outlineFrag = `
  uniform float mistLevel;
  varying float vHeight;
  void main() {
    float alpha = smoothstep(mistLevel - 0.05, mistLevel + 0.08, vHeight);
    gl_FragColor = vec4(0.04, 0.03, 0.05, alpha);
  }
`;

const ridgeVert = `
  uniform sampler2D heightMap;
  uniform float displacementScale;
  varying float vHeight;
  varying float vCurvature;
  varying float vSlope;
  void main() {
    float eps = 1.0 / 512.0;
    float h   = texture2D(heightMap, uv).r;
    float hL  = texture2D(heightMap, uv + vec2(-eps, 0.0)).r;
    float hR  = texture2D(heightMap, uv + vec2( eps, 0.0)).r;
    float hD  = texture2D(heightMap, uv + vec2(0.0, -eps)).r;
    float hU  = texture2D(heightMap, uv + vec2(0.0,  eps)).r;
    float hLL = texture2D(heightMap, uv + vec2(-2.0*eps, 0.0)).r;
    float hRR = texture2D(heightMap, uv + vec2( 2.0*eps, 0.0)).r;
    float hDD = texture2D(heightMap, uv + vec2(0.0,-2.0*eps)).r;
    float hUU = texture2D(heightMap, uv + vec2(0.0, 2.0*eps)).r;
    vHeight = h;
    vSlope = length(vec2((hR-hL)*displacementScale, (hU-hD)*displacementScale));
    float lap  = abs(hL + hR + hD + hU - 4.0 * h);
    float lap2 = abs(hLL + hRR - 2.0*h) + abs(hDD + hUU - 2.0*h);
    vCurvature = lap * 130.0 + lap2 * 65.0;
    vec3 N = normalize(vec3((hL-hR)*displacementScale*3.5, 2.0, (hD-hU)*displacementScale*3.5));
    vec3 displaced = position + normal * h * displacementScale + N * 0.05;
    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(displaced, 1.0);
  }
`;
const ridgeFrag = `
  uniform float mistLevel;
  varying float vHeight;
  varying float vCurvature;
  varying float vSlope;
  void main() {
    // Sensitive enough to show texture on lit faces
    float s = smoothstep(0.3, 1.0, vCurvature);
    s = max(s, smoothstep(1.5, 3.0, vSlope) * 0.6);
    if (s < 0.06) discard;
    float alpha = s * smoothstep(mistLevel - 0.05, mistLevel + 0.10, vHeight);
    gl_FragColor = vec4(0.05, 0.04, 0.06, alpha * 0.9);
  }
`;

const loader = new THREE.TextureLoader();
loader.load(HM_B64, function(heightTex) {
  heightTex.wrapS = heightTex.wrapT = THREE.ClampToEdgeWrapping;

  const SEGS = 512, DISP = 13.0, MIST = 0.06;

  const makeGeo = () => {
    const g = new THREE.PlaneGeometry(24, 24, SEGS, SEGS);
    g.rotateX(-Math.PI / 2);
    return g;
  };

  const addMesh = (geo, mat) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(0, -2.0, 0);
    scene.add(m);
    return m;
  };

  addMesh(makeGeo(), new THREE.ShaderMaterial({
    uniforms: { heightMap:{value:heightTex}, displacementScale:{value:DISP}, outlineThickness:{value:0.16}, mistLevel:{value:MIST} },
    vertexShader: outlineVert, fragmentShader: outlineFrag,
    side: THREE.BackSide, transparent: true,
  }));

  addMesh(makeGeo(), new THREE.ShaderMaterial({
    uniforms: { heightMap:{value:heightTex}, displacementScale:{value:DISP}, mistLevel:{value:MIST} },
    vertexShader: surfaceVert, fragmentShader: surfaceFrag,
    transparent: true, side: THREE.FrontSide,
  }));

  addMesh(makeGeo(), new THREE.ShaderMaterial({
    uniforms: { heightMap:{value:heightTex}, displacementScale:{value:DISP}, mistLevel:{value:MIST} },
    vertexShader: ridgeVert, fragmentShader: ridgeFrag,
    transparent: true, side: THREE.FrontSide, depthWrite: false,
  }));

  const wg = new THREE.PlaneGeometry(100, 100);
  wg.rotateX(-Math.PI / 2);
  const water = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({
    color: 0xc5cec5, transparent: true, opacity: 0.25, roughness: 0.05,
  }));
  water.position.set(0, -1.85, 0);
  scene.add(water);
});

// Scroll-driven spiral climb — camera winds up around the peak as user scrolls
const camPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 18,  1,  10),  // ground level, front-right
  new THREE.Vector3(  6,  3,  20),  // sweep to front
  new THREE.Vector3(-12,  5,  16),  // front-left
  new THREE.Vector3(-20,  8,   2),  // full left face
  new THREE.Vector3(-16, 11,  -8),  // back-left, rising
  new THREE.Vector3(  0, 13, -14),  // directly behind, high
  new THREE.Vector3( 14, 15,  -5),  // back-right
  new THREE.Vector3( 18, 17,   4),  // right face, near top
  new THREE.Vector3(  6, 19,  10),  // summit level
]);

const lookPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,  0, 0),
  new THREE.Vector3(0,  4, 0),
  new THREE.Vector3(0,  8, 0),
  new THREE.Vector3(0, 11, 0),
]);

// Init camera at path start
camera.position.copy(camPath.getPoint(0));
camera.lookAt(lookPath.getPoint(0));

let scrollProgress = 0;

window.addEventListener('scroll', () => {
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  scrollProgress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
  scrollProgress = Math.max(0, Math.min(1, scrollProgress));

  const pct = Math.round(scrollProgress * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  const info = document.getElementById('info');
  if (scrollProgress < 0.04) info.textContent = '↓ scroll to ascend';
  else if (scrollProgress > 0.95) info.textContent = '✦ summit reached';
  else info.textContent = pct + '% ascended';
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let clock = 0;
function animate() {
  requestAnimationFrame(animate);
  clock += 0.016;

  const p = Math.max(0, Math.min(1, scrollProgress));
  const cp = camPath.getPoint(p);
  const lp = lookPath.getPoint(p);
  camera.position.lerp(cp, 0.09);
  camera.lookAt(lp);

  if (window.fogCylMat) window.fogCylMat.uniforms.time.value = clock;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
